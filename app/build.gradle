plugins { id 'com.android.application' }

android { namespace 'com.rodentcontrol.customer'; compileSdk 35
    defaultConfig { applicationId 'com.rodentcontrol.customer'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0.0';
        buildConfigField 'String','API_BASE_URL','"https://foodkcn.com/api/"'
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
}
